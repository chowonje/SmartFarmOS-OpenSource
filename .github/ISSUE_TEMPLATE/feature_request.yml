name: Feature request
description: Propose a scoped product or platform improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the operator problem before proposing an implementation. New dependencies, providers, commands, permissions, and physical-device claims require explicit boundary review.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I checked the feature parity plan and existing issues.
          required: true
        - label: This request does not include credentials or private farm data.
          required: true
        - label: I distinguished simulator evidence from physical-device and production claims.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what outcome is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not just a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Affected boundaries
      options:
        - label: Public API or runtime contract
        - label: Production identity or admin authorization
        - label: Farm/device authorization
        - label: Command or physical safety behavior
        - label: Raspberry Pi, MQTT, or physical-device adapter
        - label: External provider or credential
        - label: Persistence or migration
        - label: User interface or accessibility
        - label: Documentation only
  - type: textarea
    id: verification
    attributes:
      label: Acceptance evidence
      description: What automated checks, browser flow, field session, physical-device evidence, or documentation would prove completion? State what remains outside scope.
    validations:
      required: true

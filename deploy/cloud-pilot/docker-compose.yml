services:
  cloud-pilot:
    build:
      context: ../..
      dockerfile: deploy/cloud-pilot/Dockerfile
    image: smartfarm-os-cloud-pilot:local
    init: true
    restart: unless-stopped
    environment:
      SMARTFARM_DEMO_MODE: "1"
      SMARTFARM_DEMO_PORT: "3100"
      SMARTFARM_PWA_PORT: "4173"
      SMARTFARM_DEMO_DB_PATH: ${SMARTFARM_DEMO_DB_PATH:-/data/smartfarm-demo.sqlite}
      SMARTFARM_DEMO_KEY: ${SMARTFARM_DEMO_KEY:?Set SMARTFARM_DEMO_KEY in deploy/cloud-pilot/.env}
      SMARTFARM_OPENWEATHER_API_KEY: ${SMARTFARM_OPENWEATHER_API_KEY:-}
      SMARTFARM_SITE_ADDRESS: ${SMARTFARM_SITE_ADDRESS:?Set SMARTFARM_SITE_ADDRESS in deploy/cloud-pilot/.env}
      SMARTFARM_BASIC_AUTH_USER: ${SMARTFARM_BASIC_AUTH_USER:?Set SMARTFARM_BASIC_AUTH_USER in deploy/cloud-pilot/.env}
      SMARTFARM_BASIC_AUTH_HASH: ${SMARTFARM_BASIC_AUTH_HASH:?Set SMARTFARM_BASIC_AUTH_HASH in deploy/cloud-pilot/.env}
      XDG_DATA_HOME: /srv/caddy-data
      XDG_CONFIG_HOME: /srv/caddy-config
    ports:
      - "${SMARTFARM_HTTP_PORT:-80}:80"
      - "${SMARTFARM_HTTPS_PORT:-443}:443"
    volumes:
      - smartfarm_cloud_pilot_data:/data
      - smartfarm_cloud_pilot_caddy_data:/srv/caddy-data
      - smartfarm_cloud_pilot_caddy_config:/srv/caddy-config
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

volumes:
  smartfarm_cloud_pilot_data:
  smartfarm_cloud_pilot_caddy_data:
  smartfarm_cloud_pilot_caddy_config:
